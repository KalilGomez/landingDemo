<!-- ============================================
     NAVBAR - BARRA DE NAVEGACIÓN PRINCIPAL
     ============================================ -->
<nav class="navbar">
  <div class="navbar-container">

    <!-- === LOGO Y MARCA === -->
    <div class="nav-logo">
      <!-- Logo clickeable que navega a la ruta principal -->
      <a routerLink="/" class="logo-link" (click)="closeMobileMenu()">
        <!-- Contenedor del icono/imagen del logo -->
        <div class="logo-icon">
          <img src="Logo.webp" alt="Optica Omega Logo" class="logo-img">
        </div>
        <!-- Texto del logo dividido en dos líneas -->
        <span class="logo-text">
          <span class="logo-optica">Landing</span>
          <span class="logo-omega">Demo</span>
        </span>
      </a>
    </div>

    <!-- === MENÚ DE NAVEGACIÓN === -->
    <div class="navbar-menu" [class.mobile-open]="isMobileMenuOpen" [class.show]="isMobileMenuOpen">
      <!-- 
        Cambio principal: usar routerLink en lugar de href + scroll
        routerLinkActive: marca automáticamente el enlace activo
      -->
      <a *ngFor="let item of menuItems" 
         class="nav-link" 
         [routerLink]="item.route"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: item.id === 'home'}"
         (click)="closeMobileMenu()">
        <!-- Ícono del enlace -->
        <i [class]="item.icon" class="nav-icon"></i>
        <!-- Texto del enlace -->
        <span class="nav-text">{{ item.label }}</span>
        <!-- Indicador visual -->
        <span class="nav-indicator"></span>
      </a>
    </div>

    <!-- === BOTÓN HAMBURGUESA MÓVIL === -->
    <div class="mobile-menu-button">
      <button class="hamburger" [class.active]="isMobileMenuOpen" (click)="toggleMobileMenu()" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</nav>

<!-- ============================================
     OVERLAY MÓVIL
     ============================================ -->
<div class="mobile-overlay" [class.active]="isMobileMenuOpen" (click)="closeMobileMenu()"></div>

<!-- ============================================
     ROUTER OUTLET - CONTENIDO DINÁMICO
     ============================================ -->
<!-- Aquí se cargarán los componentes según la ruta activa -->
<router-outlet></router-outlet>
