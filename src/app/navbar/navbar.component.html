<!-- ============================================
     NAVBAR - VERSIÓN CON ANGULAR ROUTER
     ============================================ -->
<nav class="navbar">
  <div class="navbar-container">

    <!-- === LOGO Y MARCA === -->
    <div class="nav-logo">
      <!-- Logo con routerLink que navega al inicio -->
      <a class="logo-link" routerLink="/inicio">
        <div class="logo-icon">
          <img src="Logo.webp" alt="Optica Omega Logo" class="logo-img">
        </div>
        <span class="logo-text">
          <span class="logo-optica">Landing</span>
          <span class="logo-omega">Demo</span>
        </span>
      </a>
    </div>

    <!-- === MENÚ DE NAVEGACIÓN === -->
    <div class="navbar-menu" [class.mobile-open]="isMobileMenuOpen" [class.show]="isMobileMenuOpen">
      <!-- 
        CAMBIOS IMPLEMENTADOS:
        - [routerLink]="item.route" → Vincula el enlace a la ruta de Angular
        - routerLinkActive="active" → Aplica clase 'active' automáticamente
        - (click)="closeMobileMenu()" → Cierra el menú móvil al hacer click
        - item.route en lugar de item.id → Usa rutas en lugar de IDs de sección
      -->
      <a 
        *ngFor="let item of menuItems" 
        class="nav-link" 
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: false}"
        (click)="closeMobileMenu()"
      >
        <i [class]="item.icon" class="nav-icon"></i>
        <span class="nav-text">{{ item.label }}</span>
        <span class="nav-indicator"></span>
      </a>
    </div>

    <!-- === BOTÓN HAMBURGUESA MÓVIL === -->
    <div class="mobile-menu-button">
      <button 
        class="hamburger" 
        [class.active]="isMobileMenuOpen" 
        (click)="toggleMobileMenu()" 
        aria-label="Toggle menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</nav>

<!-- === OVERLAY MÓVIL === -->
<div 
  class="mobile-overlay" 
  [class.active]="isMobileMenuOpen" 
  (click)="closeMobileMenu()"
></div>
