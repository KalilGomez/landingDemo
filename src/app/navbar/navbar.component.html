<!-- ============================================
     NAVBAR - VERSIÓN CON ANGULAR ROUTER
     ============================================ -->
<nav class="navbar">
  <div class="navbar-container">

    <!-- === LOGO Y MARCA === -->
    <div class="nav-logo">
      <a class="logo-link" routerLink="/inicio">
        <div class="logo-icon">
          <img src="Logo.webp" alt="Optica Omega Logo" class="logo-img">
        </div>
        <span class="logo-text">
          <span class="logo-optica">Landing</span>
          <span class="logo-omega">Demo</span>
        </span>
      </a>
    </div>

    <!-- === MENÚ DE NAVEGACIÓN === -->
    <div class="navbar-menu" [class.mobile-open]="isMobileMenuOpen" [class.show]="isMobileMenuOpen">

      <!-- Links normales del menú -->
      <a *ngFor="let item of menuItems" class="nav-link" [routerLink]="item.route" routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: false}" (click)="closeMobileMenu()">
        <i [class]="item.icon" class="nav-icon"></i>
        <span class="nav-text">{{ item.label }}</span>
        <span class="nav-indicator"></span>
      </a>

      <!-- === NUEVO: MENÚ DROPDOWN TIENDA === -->
      <div class="nav-dropdown-wrapper">
        <!-- Botón principal que navega a /shop -->
        <a class="nav-link nav-dropdown-trigger" routerLink="/shop" routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: false}" (click)="closeMobileMenu()">
          <i class="bi bi-shop nav-icon"></i>
          <span class="nav-text">Tienda</span>
          <i class="bi bi-chevron-down dropdown-arrow"></i>
        </a>

        <!-- Menú desplegable -->
        <div class="nav-dropdown-menu">
          <!-- Favoritos - Abre modal -->
          <button class="nav-dropdown-item" (click)="openFavoritesModal()">
            <div class="icon-with-badge">
              <i class="bi bi-heart"></i>
              <span class="badge-count" *ngIf="favoritesCount > 0">{{ favoritesCount }}</span>
            </div>
            <span>Favoritos</span>
          </button>

          <!-- Carrito - Abre modal -->
          <button class="nav-dropdown-item" (click)="openCartModal()">
            <div class="icon-with-badge">
              <i class="bi bi-cart3"></i>
              <span class="badge-count" *ngIf="cartCount > 0">{{ cartCount }}</span>
            </div>
            <span>Carrito</span>
          </button>
        </div>
      </div>

    </div>

    <!-- === BOTÓN HAMBURGUESA MÓVIL === -->
    <div class="mobile-menu-button">
      <button class="hamburger" [class.active]="isMobileMenuOpen" (click)="toggleMobileMenu()" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</nav>

<!-- === OVERLAY MÓVIL === -->
<div class="mobile-overlay" [class.active]="isMobileMenuOpen" (click)="closeMobileMenu()"></div>
<!-- === MODALES === -->
<app-cart-modal *ngIf="showCartModal" (closeModal)="closeCartModal()"></app-cart-modal>

<app-favorites-modal *ngIf="showFavoritesModal" (closeModal)="closeFavoritesModal()"></app-favorites-modal>
