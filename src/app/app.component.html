<!-- ============================================
     APP.COMPONENT.HTML - PLANTILLA PRINCIPAL CON ROUTER
     ============================================ -->

<!--
  Archivo app.component.html

  CAMBIOS REALIZADOS:
  - Eliminadas las etiquetas <section> con IDs
  - Reemplazado el contenido de <main> por <router-outlet>
  - El router-outlet renderiza dinámicamente los componentes según la ruta activa
  
  Estructura actual:
  - Navbar: Permanece fijo en todas las vistas
  - <router-outlet>: Aquí se cargan los componentes de página según la URL
  - Whatsapp y Footer: Permanecen fijos en todas las vistas
-->

<div class="app-wrapper">

  <!-- ============================================
       NAVBAR
       --------------------------------------------
       Componente de navegación superior.
       Ahora usa routerLink para navegar entre rutas.
  ============================================ -->
  <app-navbar></app-navbar>

  <!-- ============================================
       ROUTER OUTLET - CONTENIDO DINÁMICO
       --------------------------------------------
       Aquí se renderizan los componentes según la ruta activa:
       - /inicio → HomeComponent
       - /productos → ProductsComponent
       - /servicios → ServicesComponent
       - /acerca-de → AboutUsComponent
       - /contacto → ContactComponent
       - /shop → ShopComponent
       
       Ya no necesitas <section id="..."> porque cada componente
       se renderiza en su propia ruta independiente.
  ============================================ -->
  <main>
    <router-outlet></router-outlet>
  </main>

  <!-- ============================================
       BOTÓN WHATSAPP FLOTANTE
       --------------------------------------------
       Permite contacto rápido desde cualquier parte de la página.
  ============================================ -->
  <app-whatsapp></app-whatsapp>

  <!-- ============================================
       FOOTER
       --------------------------------------------
       Componente de pie de página con info y links útiles.
  ============================================ -->
  <app-footer></app-footer>

</div>
