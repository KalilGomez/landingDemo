<!-- ============================================
     APP.COMPONENT.HTML - PLANTILLA PRINCIPAL DE LA APP
     ============================================ -->

<!--
  Archivo app.component.html

  Este template define la estructura visual principal de la aplicación.
  
  Aquí se incluyen:
  - Navbar (fijo en todas las vistas)
  - Router Outlet (contenido dinámico según la ruta)
  - Componentes globales (Whatsapp flotante, Footer)

  El router-outlet cargará dinámicamente los componentes según la ruta activa.
-->

<div class="app-wrapper">

  <!-- ============================================
       NAVBAR
       --------------------------------------------
       Componente de navegación superior.
       Se mantiene fijo en todas las rutas.
       Usa routerLink para navegar entre páginas.
  ============================================ -->
  <app-navbar></app-navbar>

  <!-- ============================================
       CONTENIDO PRINCIPAL (MAIN)
       --------------------------------------------
       El router-outlet carga dinámicamente los componentes
       según la ruta activa definida en app.routes.ts
       
       Rutas disponibles:
       - / → HomeComponent
       - /productos → ProductsComponent
       - /servicios → ServicesComponent
       - /acerca-de → AboutUsComponent
       - /contacto → ContactComponent
       - /shop → ShopComponent
  ============================================ -->
  <main>
    <router-outlet></router-outlet>
  </main>

  <!-- ============================================
       BOTÓN WHATSAPP FLOTANTE
       --------------------------------------------
       Permite contacto rápido desde cualquier ruta de la página.
       Se mantiene visible en todas las vistas.
  ============================================ -->
  <app-whatsapp></app-whatsapp>

  <!-- ============================================
       FOOTER
       --------------------------------------------
       Componente de pie de página con info y links útiles.
       Se mantiene visible en todas las vistas.
  ============================================ -->
  <app-footer></app-footer>

</div>
