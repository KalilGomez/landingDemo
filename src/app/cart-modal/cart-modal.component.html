<!-- Backdrop del modal -->
<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-container" (click)="$event.stopPropagation()">
    
    <!-- Header del modal -->
    <div class="modal-header">
      <h2 class="modal-title">
        <i class="bi bi-cart3"></i>
        Carrito de Compras
      </h2>
      <button class="modal-close" (click)="close()" aria-label="Cerrar">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <!-- Body del modal -->
    <div class="modal-body">
      
      <!-- Carrito vacío -->
      <div *ngIf="cartItems.length === 0" class="empty-state">
        <i class="bi bi-cart-x"></i>
        <h3>Tu carrito está vacío</h3>
        <p>Agrega productos para comenzar tu compra</p>
        <button class="btn-primary" routerLink="/productos" (click)="close()">
          Ver Productos
        </button>
      </div>

      <!-- Lista de productos -->
      <div *ngIf="cartItems.length > 0" class="cart-items">
        <div *ngFor="let item of cartItems" class="cart-item">
          
          <!-- Imagen del producto -->
          <div class="item-image">
            <img [src]="item.image" [alt]="item.name">
          </div>

          <!-- Info del producto -->
          <div class="item-info">
            <h4>{{ item.name }}</h4>
            <p class="item-price">${{ item.price | number:'1.2-2' }}</p>
          </div>

          <!-- Controles de cantidad -->
          <div class="item-controls">
            <div class="quantity-control">
              <button (click)="updateQuantity(item.id, item.quantity - 1)">
                <i class="bi bi-dash"></i>
              </button>
              <span>{{ item.quantity }}</span>
              <button (click)="updateQuantity(item.id, item.quantity + 1)">
                <i class="bi bi-plus"></i>
              </button>
            </div>
            <button class="btn-remove" (click)="removeFromCart(item.id)">
              <i class="bi bi-trash"></i>
            </button>
          </div>

          <!-- Subtotal -->
          <div class="item-subtotal">
            ${{ (item.price * item.quantity) | number:'1.2-2' }}
          </div>
        </div>
      </div>
    </div>

    <!-- Footer del modal -->
    <div class="modal-footer" *ngIf="cartItems.length > 0">
      <div class="total-section">
        <span class="total-label">Total:</span>
        <span class="total-amount">${{ cartTotal | number:'1.2-2' }}</span>
      </div>
      <div class="footer-actions">
        <button class="btn-secondary" (click)="close()">
          Seguir Comprando
        </button>
        <button class="btn-primary" routerLink="/shop" (click)="close()">
          Ir a Pagar
        </button>
      </div>
    </div>

  </div>
</div>
